name: Android debug build
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Run browser logic smoke tests
        run: node tests/demo_logic_smoke.js
      - name: Run Android unit tests and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mosque-auto-silent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
